name: unitflow
description: A precise, offline-first unit converter powered by UnitFlow's Rust domain core.
publish_to: "none"
version: 0.1.0-alpha.1+1

repository: https://github.com/sanskarIN/unitflow

funding:
  - https://buymeacoffee.com/sanskarIN

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_rust_bridge: 2.12.0
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
