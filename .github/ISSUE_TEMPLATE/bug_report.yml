name: Bug report
description: Report a reproducible problem in UnitFlow
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve UnitFlow. Please remove private data, secrets, and unrelated personal information before posting logs or screenshots.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
        - Linux
        - macOS
        - iOS
        - Web
        - Rust core only
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: UnitFlow version or commit
      placeholder: 0.1.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Give the smallest reliable sequence that reproduces the issue.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Enter ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Add sanitized logs, screenshots, or environment details when useful.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and sensitive personal data from this report.
          required: true
        - label: I can reproduce this on the version or commit listed above.
          required: true
