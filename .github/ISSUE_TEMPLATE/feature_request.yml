name: Feature request
description: Suggest an improvement for UnitFlow
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user need would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, UI, units, or workflow you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or tradeoffs.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rust core
        - Flutter UI
        - Unit catalog
        - Accessibility
        - Documentation
        - Build and release
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
