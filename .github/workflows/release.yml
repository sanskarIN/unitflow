name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-core:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Test release profile
        run: cargo test --workspace --all-features --release
      - name: Build release profile
        run: cargo build --workspace --all-features --release

  flutter-web:
    name: Flutter web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate missing platform shell
        run: flutter create --platforms=web --project-name unitflow --org in.sanskar.unitflow .
      - name: Build web release
        run: flutter build web --release
      - name: Package web release
        run: tar -C build/web -czf ../../unitflow-web-${{ github.ref_name }}.tar.gz .
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-web-${{ github.ref_name }}
          path: unitflow-web-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  flutter-android:
    name: Flutter Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate missing platform shell
        run: flutter create --platforms=android --project-name unitflow --org in.sanskar.unitflow .
      - name: Build unsigned APK
        run: flutter build apk --release
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-android-${{ github.ref_name }}
          path: apps/unitflow_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  flutter-linux:
    name: Flutter Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Linux prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate missing platform shell
        run: flutter create --platforms=linux --project-name unitflow --org in.sanskar.unitflow .
      - name: Build Linux release
        run: flutter build linux --release
      - name: Package Linux release
        run: tar -C build/linux/x64/release/bundle -czf ../../../../unitflow-linux-${{ github.ref_name }}.tar.gz .
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-linux-${{ github.ref_name }}
          path: unitflow-linux-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  flutter-windows:
    name: Flutter Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate missing platform shell
        run: flutter create --platforms=windows --project-name unitflow --org in.sanskar.unitflow .
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../../unitflow-windows-${{ github.ref_name }}.zip
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-windows-${{ github.ref_name }}
          path: unitflow-windows-${{ github.ref_name }}.zip
          if-no-files-found: error

  flutter-macos-ios:
    name: Flutter macOS and iOS validation
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate Apple platform shells
        run: flutter create --platforms=macos,ios --project-name unitflow --org in.sanskar.unitflow .
      - name: Build macOS release
        run: flutter build macos --release
      - name: Validate iOS no-codesign build
        run: flutter build ios --release --no-codesign
      - name: Package macOS release
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/UnitFlow.app ../../unitflow-macos-${{ github.ref_name }}.zip
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-macos-${{ github.ref_name }}
          path: unitflow-macos-${{ github.ref_name }}.zip
          if-no-files-found: error
