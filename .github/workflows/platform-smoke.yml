name: Cross-platform build matrix

on:
  push:
    branches: [main]
    paths:
      - 'apps/unitflow_app/**'
      - '.github/workflows/platform-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/unitflow_app/**'
      - '.github/workflows/platform-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Web project exists
        shell: bash
        run: |
          if [[ ! -d web ]]; then
            flutter create --platforms=web --org in.sanskar --project-name unitflow .
          fi

      - name: Resolve and generate
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Web release
        run: flutter build web --release

      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-web-release
          path: apps/unitflow_app/build/web
          if-no-files-found: error

  android:
    name: Android release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure Android project exists
        shell: bash
        run: |
          if [[ ! -d android ]]; then
            flutter create --platforms=android --org in.sanskar --project-name unitflow .
          fi

      - name: Resolve and generate
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Android release app bundle
        run: flutter build appbundle --release

      - name: Upload Android bundle
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-android-release-aab
          path: apps/unitflow_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  linux:
    name: Linux release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Ensure Linux project exists
        shell: bash
        run: |
          if [[ ! -d linux ]]; then
            flutter create --platforms=linux --org in.sanskar --project-name unitflow .
          fi

      - name: Resolve and generate
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-linux-release
          path: apps/unitflow_app/build/linux/x64/release/bundle
          if-no-files-found: error

  windows:
    name: Windows release bundle
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Ensure Windows project exists
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            flutter create --platforms=windows --org in.sanskar --project-name unitflow .
          }

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-windows-release
          path: apps/unitflow_app/build/windows/x64/runner/Release
          if-no-files-found: error

  macos:
    name: macOS release app
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Ensure macOS project exists
        shell: bash
        run: |
          if [[ ! -d macos ]]; then
            flutter create --platforms=macos --org in.sanskar --project-name unitflow .
          fi

      - name: Resolve and generate
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build macOS release app
        run: flutter build macos --release

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-macos-release
          path: apps/unitflow_app/build/macos/Build/Products/Release/*.app
          if-no-files-found: error

  ios:
    name: iOS release app (no codesign)
    runs-on: macos-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure iOS project exists
        shell: bash
        run: |
          if [[ ! -d ios ]]; then
            flutter create --platforms=ios --org in.sanskar --project-name unitflow .
          fi

      - name: Resolve and generate
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build iOS release app without signing
        run: flutter build ios --release --no-codesign

      - name: Upload iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: unitflow-ios-release-no-codesign
          path: apps/unitflow_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
