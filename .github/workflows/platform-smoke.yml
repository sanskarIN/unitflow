name: Generated platform smoke

on:
  push:
    branches: [main]
    paths:
      - 'apps/unitflow_app/**'
      - '.github/workflows/platform-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/unitflow_app/**'
      - '.github/workflows/platform-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Generated Web build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Web scaffold
        run: flutter create --platforms=web --org in.sanskar --project-name unitflow .

      - name: Resolve and generate
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Web release
        run: flutter build web --release

  android:
    name: Generated Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/unitflow_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org in.sanskar --project-name unitflow .

      - name: Resolve and generate
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Build Android debug APK
        run: flutter build apk --debug
