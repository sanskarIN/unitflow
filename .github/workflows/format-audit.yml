name: Format audit branch

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-audit-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'audit/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Rust
        run: cargo fmt --all

      - name: Format Dart
        working-directory: apps/unitflow_app
        run: dart format lib test

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add crates apps
          git commit -m "style: apply automated formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
